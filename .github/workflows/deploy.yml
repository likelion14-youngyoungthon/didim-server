name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: test
        run: ./gradlew test --no-daemon

      - name: build image
        run: |
          docker build -t dojang-server:latest .
          docker save dojang-server:latest | gzip > image.tar.gz

      - name: copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: image.tar.gz,docker-compose.yml,nginx/default.conf.template,nginx/05-upload-cors.sh
          target: /home/ubuntu/dojang

      - name: restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/dojang
            gunzip -c image.tar.gz | docker load
            rm image.tar.gz
            docker compose up -d
            # 앱 컨테이너가 새로 뜨면 nginx가 예전 주소를 들고 있어 502가 난다
            docker compose restart nginx
            docker image prune -f
