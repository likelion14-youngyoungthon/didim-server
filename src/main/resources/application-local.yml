cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  datasource:
    url: jdbc:h2:mem:dojang;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
  jpa:
    hibernate:
      ddl-auto: create-drop

# 로컬 전용 값. 운영은 .env의 JWT_SECRET_KEY를 쓴다
jwt:
  secret: ${JWT_SECRET_KEY:local-only-secret-change-me-0123456789abcdef}

logging:
  level:
    com.likelionknu.dojang: DEBUG
