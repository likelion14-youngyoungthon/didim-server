spring:
  application:
    name: dojang
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:.env[.properties]
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false

# nginx가 넘기는 X-Forwarded-Proto를 읽어 Swagger 주소를 https로 만든다
server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET_KEY}
  expire-days: 7

kakao:
  rest-key: ${KAKAO_REST_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}

demo-login:
  enabled: ${DEMO_LOGIN_ENABLED:true}
